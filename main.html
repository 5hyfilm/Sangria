<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Inside Web</title>
    <link href="styles/main.css" rel="stylesheet">
    <link href="styles/project_list.css" rel="stylesheet">
    <link href="styles/modal.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="sidebar">
        <img src="images/logo.png" alt="Makro Logo" class="logo">
        <ul>
            <li><a href="#accredible" onclick="showContent('accredible')">Accredible</a></li>
            <li><a href="#assistance" onclick="showContent('assistance')">Assistance</a></li>
            <li><a href="#dashboard" onclick="showContent('dashboard')">Dashboard</a></li>
            <li><a href="#project" onclick="showContent('project')">Project</a></li>
        </ul>
        <button class="logout-button" onclick="logout()">Log Out</button>
    </div>
    <div class="content">
        <div id="accredible" class="tab-content">
            <div class="tab-header">
                <img src="images/logo_accredible.jpeg" alt="Accredible Logo" class="section-logo">
                <a href="https://dashboard.accredible.com" target="_blank">Accredible</a>
            </div>
            <iframe src="https://dashboard.accredible.com/issuer/dashboard/" frameborder="0"></iframe>
        </div>
        <div id="assistance" class="tab-content">
            <div class="tab-header">
                <img src="images/logo_aistudio_.jpeg" alt="Assistance Logo" class="section-logo">
                <a href="https://makrohrweb.azurewebsites.net/" target="_blank">Assistance</a>
                <button class="chatgpt-button" onclick="openChatGPT()">Go to Assistance on ChatGPT</button>
            </div>
            <iframe src="https://makrohrweb.azurewebsites.net/" frameborder="0"></iframe>
        </div>
        <div id="dashboard" class="tab-content">
            <div class="tab-header">
                <img src="images/logo_powerbi.png" alt="Dashboard Logo" class="section-logo">
                <a href="https://app.powerbi.com/view?r=eyJrIjoiOWVlZTlmZTMtNjA3NC00Mjg4LTg2YjktMjA4NGE4ZTdhYjQ0IiwidCI6IjI3MWQ1ZTdiLTEzNTAtNGI5Ni1hYjg0LTUyZGJkYTRjZjQwYyIsImMiOjEwfQ%3D%3D" target="_blank">Dashboard</a>
            </div>
            <iframe title="employeeBi" width="600" height="373.5" src="https://app.powerbi.com/view?r=eyJrIjoiYTZiYjhkZGItMzFjYS00MDc4LTkxZDUtYWY3NzdhNTg0MzJjIiwidCI6IjI3MWQ1ZTdiLTEzNTAtNGI5Ni1hYjg0LTUyZGJkYTRjZjQwYyIsImMiOjEwfQ%3D%3D" frameborder="0" allowFullScreen="true"></iframe>
        </div>
        <div id="project" class="tab-content">
            <div class="tab-header">
                <img src="images/logo_project.png" alt="Project Logo" class="section-logo">
                <a href="#" target="_blank">Project Matching</a>
                <button class="create-project-button" onclick="showCreateProject()">Create a Project</button>
                <button class="back-project-button" onclick="showProjectList()" style="display: none;">Back to Project List</button>
            </div>
            <iframe id="projectDefaultIframe" title="projectListBi" width="600" height="373.5" src="https://app.powerbi.com/view?r=eyJrIjoiYjRiNzkwNzgtYTlhMC00ODQ0LWJmYjAtZjVhMzE0YjY2N2ExIiwidCI6IjI3MWQ1ZTdiLTEzNTAtNGI5Ni1hYjg0LTUyZGJkYTRjZjQwYyIsImMiOjEwfQ%3D%3D" frameborder="0" allowFullScreen="true"></iframe>
            <iframe id="projectCreateIframe" width="640px" height="480px" src="" frameborder="0" style="border: none; max-width:100%; max-height:100vh; display: none;" allowfullscreen webkitallowfullscreen mozallowfullscreen msallowfullscreen></iframe>
        </div>
    </div>

    <script src="scripts/main.js"></script>
</body>
</html>
